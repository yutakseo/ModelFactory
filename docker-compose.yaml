name: modelfactory

services:
  huggingface:
    build:
      context: .
      dockerfile: huggingface/Dockerfile
    image: mf-huggingface:1.0
    container_name: huggingface
    working_dir: /workspace
    init: true
    restart: always
    entrypoint:
      - /bin/bash
      - -lc
      - |
        if [[ -x /workspace/.codex-remote/start.sh ]]; then
          exec /workspace/.codex-remote/start.sh
        fi
        echo "Codex remote startup script not found; keeping the container available."
        exec sleep infinity
    ipc: host
    stdin_open: true
    tty: true
    shm_size: "128gb"
    gpus: all
    environment:
      HF_HOME: /workspace/.cache/huggingface
      HF_HUB_CACHE: /workspace/.cache/huggingface/hub
      HF_DATASETS_CACHE: /workspace/.cache/huggingface/datasets
      HF_TOKEN: ${HF_TOKEN:-}
      CODEX_HOME: /root/.codex
    volumes:
      - ./huggingface/workspace:/workspace
      - ./huggingface/model_repository:/workspace/model_repository
      - codex_home:/root/.codex
      - /mnt/datasets:/workspace/datasets
    command: ["sleep", "infinity"]

  triton:
    build:
      context: .
      dockerfile: triton/Dockerfile
    image: mf-triton-server:1.0
    container_name: triton
    ipc: host
    shm_size: "64gb"
    gpus: all
    ulimits:
      memlock: -1
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "18000:8000"
      - "18001:8001"
      - "18002:8002"
    volumes:
      - ./huggingface/workspace/.cache/huggingface:/root/.cache/huggingface
      - ./huggingface/model_repository:/models
    command:
      - /bin/bash
      - -c
      - exec tritonserver --model-repository=/models

volumes:
  codex_home:
